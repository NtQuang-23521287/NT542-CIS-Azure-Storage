name: Offline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Offline tests and core coverage
        run: >-
          python -m pytest -m "not live" -q
          --cov=evaluator --cov=remediation --cov=incident_response --cov=azure_cli
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=80

  terraform:
    name: Terraform syntax and provider validation (${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [azure-minimal-storage, azure-secure-storage]
    defaults:
      run:
        working-directory: Terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.9
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Initialize providers without backend or Azure login
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration without plan or apply
        run: terraform validate -no-color

  iac:
    name: Trivy Terraform misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Block HIGH and CRITICAL IaC findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Terraform
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: v0.70.0
