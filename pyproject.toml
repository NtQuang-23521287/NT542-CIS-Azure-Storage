[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nt542-cis-azure-storage"
version = "0.2.0"
description = "Educational Azure compliance and controlled-remediation lab"
requires-python = ">=3.14,<3.15"
dependencies = [
    "azure-identity>=1.25.3,<2",
    "azure-mgmt-resource>=25,<26",
    "azure-mgmt-storage>=25,<26",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
acg = "azure_compliance_guard.cli:main"

[project.optional-dependencies]
dev = [
    "uv>=0.13.5,<0.14",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "Compliance/engine"]
addopts = "-m 'not live'"
markers = [
    "integration: offline tests crossing module or file boundaries",
    "live: tests requiring real Azure resources and explicit credentials",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azure_compliance_guard = ["rules/*.yaml", "fixtures/*.json"]
